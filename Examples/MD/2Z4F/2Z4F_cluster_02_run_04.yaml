task_name: 2Z4F_cluster_02_run_04

slurm:
  #These are just here as an example of job-specific slurm options, but they are also the defaults set in installation.yaml
  #Do not specify the --array command here. Use the num_tasks parameter below.
  output: slurm-%A_%a_%x.out
  error: slurm-%A_%a_%x.err
  time: "7-00:00:00"
  #slurm_options_string: #You can use this option to pass a string of options instead of passing them individually.

num_tasks: 1

# Config for the current run
pdb_path: Examples/MD/2Z4F/cluster_02_DDR2_without_water.pdb # Path to input PDB file || null when building unconditionally
output_dir: Examples/Examples_out/MD/2Z4F/cluster_02/run_04/ # Path to output directory
chains_to_design: null
contig: "[12-15]" # Contig to design
num_designs_rfdiff: 2500 # Number of designs to generate with RFdiffusion
num_seq_per_target_mpnn: 4 # Number of sequences to generate per target with MPNN
afcycdesign_mpnn_cycles: 1
chain_break_cutoff_A: 2 # Chain break cutoff in angstroms (default: 2)

sampling_temp: 0.15 # ProteinMPNN parameter
backbone_noise: 0 # ProteinMPNN parameter

skipRfDiff: False
use_rosetta_filtering: False

modules:
  - ALICE/default
  - CUDA/12.1
  - cuDNN/8.9.2.26-CUDA-12.1.1

defaults:
  - installation
  - _self_

pass_to_rfdiff: # Groups to pass to RfDiff
- inference
- potentials
- contigmap

inference:
  generatedWithProsculpt: true # Leave this dummy here, otherwise it will overwrite default RfDiff base config with null
potentials:
  generatedWithProsculpt: true # Leave this dummy here, otherwise it will overwrite default RfDiff base config with null
ppi:
  hotspot_res: [A81,A138,A140]
contigmap:
  contigs: null
